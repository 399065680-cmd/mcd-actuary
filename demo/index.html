<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>麦麦精算师 McActuary - 在线 Demo</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, "Segoe UI", Roboto, "Noto Sans SC", sans-serif; background: #f5f5f5; color: #1a1a1a; }
  .header { background: linear-gradient(135deg, #d62828 0%, #ffc600 100%); padding: 40px 20px; text-align: center; }
  .header h1 { color: #fff; font-size: 28px; margin-bottom: 8px; text-shadow: 0 2px 4px rgba(0,0,0,0.2); }
  .header p { color: rgba(255,255,255,0.9); font-size: 14px; }
  .header .badges { margin-top: 12px; display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .header .badge { background: rgba(255,255,255,0.2); border: 1px solid rgba(255,255,255,0.3); border-radius: 12px; padding: 4px 12px; font-size: 12px; color: #fff; }
  .container { max-width: 720px; margin: 0 auto; padding: 24px 16px 60px; }
  .tabs { display: flex; gap: 4px; margin-bottom: 16px; flex-wrap: wrap; }
  .tab { padding: 8px 16px; border-radius: 8px 8px 0 0; cursor: pointer; font-size: 13px; border: 1px solid #ddd; border-bottom: none; background: #eee; color: #666; transition: all 0.2s; }
  .tab.active { background: #d62828; color: #fff; border-color: #d62828; }
  .tab:hover:not(.active) { background: #e8e8e8; }
  .chat-box { border: 1px solid #ddd; border-radius: 0 8px 8px 8px; background: #fafafa; overflow: hidden; }
  .chat-area { padding: 16px; min-height: 400px; display: flex; flex-direction: column; gap: 12px; }
  .msg { display: flex; gap: 8px; max-width: 90%; }
  .msg.user { align-self: flex-end; flex-direction: row-reverse; }
  .avatar { width: 32px; height: 32px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 14px; flex-shrink: 0; }
  .avatar.bot { background: #d62828; color: #ffc600; }
  .avatar.user { background: #ffc600; color: #d62828; }
  .bubble { padding: 10px 14px; border-radius: 14px; font-size: 13px; line-height: 1.6; }
  .msg.bot .bubble { background: #fff; border: 1px solid #e0e0e0; border-radius: 4px 14px 14px 14px; }
  .msg.user .bubble { background: #d62828; color: #fff; border-radius: 14px 4px 14px 14px; }
  .bubble .highlight { background: #fff3cd; padding: 2px 6px; border-radius: 4px; font-weight: 500; }
  .bubble .money { color: #d62828; font-weight: 600; }
  .bubble .points { color: #6f42c1; font-weight: 600; }
  .bubble .tag { display: inline-block; padding: 2px 8px; border-radius: 4px; font-size: 11px; margin-right: 4px; }
  .tag.rec { background: #d4edda; color: #155724; }
  .tag.warn { background: #fff3cd; color: #856404; }
  .tag.bad { background: #f8d7da; color: #721c24; }
  .plan-card { border: 1px solid #e0e0e0; border-radius: 8px; padding: 10px; margin: 8px 0; background: #f9f9f9; }
  .plan-card.rec { border-color: #28a745; border-width: 2px; background: #f0fff4; }
  .plan-card h4 { font-size: 13px; margin-bottom: 4px; display: flex; align-items: center; gap: 6px; }
  .plan-card .detail { font-size: 12px; color: #666; line-height: 1.8; }
  .plan-card .detail strong { color: #1a1a1a; }
  .input-bar { border-top: 1px solid #e0e0e0; padding: 12px; display: flex; gap: 8px; background: #fff; }
  .input-bar input { flex: 1; padding: 8px 12px; border: 1px solid #ddd; border-radius: 20px; font-size: 13px; outline: none; }
  .input-bar button { padding: 8px 16px; background: #d62828; color: #fff; border: none; border-radius: 20px; cursor: pointer; font-size: 13px; }
  .input-bar button:hover { background: #c41e1e; }
  .footer { text-align: center; margin-top: 24px; font-size: 12px; color: #999; }
  .footer a { color: #d62828; text-decoration: none; }
  .demo-note { background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px; padding: 10px 14px; font-size: 12px; color: #856404; margin-bottom: 16px; }
  .hidden { display: none; }
  @media (max-width: 480px) { .header h1 { font-size: 22px; } .container { padding: 12px; } }
</style>
</head>
<body>

<div class="header">
  <h1>麦麦精算师</h1>
  <p>你的麦当劳资产管理顾问</p>
  <div class="badges">
    <span class="badge">18 个 MCP 工具</span>
    <span class="badge">4 大模块</span>
    <span class="badge">WorkBuddy Skill</span>
  </div>
</div>

<div class="container">
  <div class="demo-note">
    Demo：这是模拟对话演示，展示麦麦精算师如何与麦当劳 MCP 交互。点击上方标签切换不同场景体验。
  </div>

  <div class="tabs">
    <div class="tab active" data-scene="save">一键领券</div>
    <div class="tab" data-scene="decision">价值决策</div>
    <div class="tab" data-scene="points">积分投资</div>
    <div class="tab" data-scene="report">月度报告</div>
  </div>

  <div class="chat-box">
    <div class="chat-area" id="chatArea"></div>
    <div class="input-bar">
      <input type="text" placeholder="输入消息..." id="msgInput" readonly>
      <button onclick="alert('这是演示页面！真正的 Skill 在 WorkBuddy 中运行，连接麦当劳 MCP 后即可使用。')">发送</button>
    </div>
  </div>

  <div class="footer">
    <p>麦麦精算师 · <a href="https://github.com/M-China/mcd-developer-innovation-challenge" target="_blank">麦当劳程序员创意开发大赛</a></p>
    <p style="margin-top:4px;">基于 WorkBuddy + 麦当劳 MCP 开发</p>
  </div>
</div>

<script>
const scenes = {
  save: [
    { role: "user", text: "帮我领券，我想吃巨无霸套餐" },
    { role: "bot", text: "已为你领取 <strong>8 张优惠券</strong>，其中 <span class='tag warn'>2 张将在 3 天内过期</span>\n\n附近门店：<strong>麦当劳(XX路店)</strong> - 距离 800m\n\n巨无霸套餐最优方案：" },
    { role: "bot", text: "<div class='plan-card rec'><h4><span class='tag rec'>推荐方案</span> 巨无霸套餐 - 立减10元券</h4><div class='detail'>原价：<span class='money'>¥39</span> -> 用券后：<span class='money'>¥29</span><br>为你节省：<strong>¥10（26% off）</strong><br>使用优惠券：巨无霸套餐立减10元</div></div><div class='plan-card'><h4>巨无霸套餐 - 8折券</h4><div class='detail'>原价：<span class='money'>¥39</span> -> 折后价：<span class='money'>¥31.2</span><br>为你节省：<strong>¥7.8（20% off）</strong></div></div>" },
    { role: "bot", text: "最优方案：使用立减10元券，实付 <span class='money'>¥29</span>，省 <span class='money'>¥10</span>。\n\n确认下单？" },
    { role: "user", text: "好的，下单！" },
    { role: "bot", text: "订单已创建！\n订单号：MCD202610091835\n取餐门店：麦当劳(XX路店)\n金额：¥29\n\n支付链接：[立即支付]" }
  ],
  decision: [
    { role: "user", text: "我想吃巨无霸，怎么最划算？" },
    { role: "bot", text: "正在对比优惠券、积分兑换和抽奖三种方案...\n\n为你找到 <strong>3 种方案</strong>：" },
    { role: "bot", text: "<div class='plan-card rec'><h4><span class='tag rec'>推荐方案</span> 方案B：积分兑换</h4><div class='detail'>花费：<span class='points'>2000 积分</span>（0 元）<br>你的积分余额：3500，其中 <span class='tag warn'>500 积分 3 天后过期！</span><br>积分性价比：★★★★☆</div></div><div class='plan-card'><h4>方案A：优惠券购买</h4><div class='detail'>花费：<span class='money'>¥15</span>（原价 ¥25）<br>折扣：4 折<br>使用优惠券：巨无霸立减10元</div></div><div class='plan-card'><h4>方案C：抽奖搏一搏</h4><div class='detail'>消耗：<span class='points'>500 积分/次</span><br>期望值 EV = <span class='money'>¥-1.0</span>（不划算）<br><span class='tag bad'>不建议</span></div></div>" },
    { role: "bot", text: "<strong>建议：选择方案B</strong> — 你的积分即将过期，兑换最划算。2000 积分相当于 ¥25 的商品价值，而用券只省 ¥10。\n\n已自动领取可用优惠券。确认用积分兑换巨无霸券吗？" }
  ],
  points: [
    { role: "user", text: "我的积分还有多少？快过期了吗？" },
    { role: "bot", text: "你的积分账户：\n\n<strong>可用积分：</strong>3,500 分\n<strong>累计积分：</strong>12,800 分\n<strong>即将过期：</strong><span class='tag warn'>500 积分，3 天后过期</span>\n\n别让积分白白浪费！以下是最优兑换方案：" },
    { role: "bot", text: "<strong>积分性价比排行：</strong>\n\n1. 巨无霸兑换券 — 2000 积分（价值约 ¥25）— 性价比 ¥0.0125 ★★★★\n2. 薯条兑换券 — 800 积分（价值约 ¥10）— 性价比 ¥0.0125 ★★★★\n3. 麦旋风兑换券 — 1500 积分（价值约 ¥12）— 性价比 ¥0.008 ★★★" },
    { role: "bot", text: "抽奖分析：每次抽奖期望值 EV = ¥-1.0（<span class='tag bad'>不划算</span>），建议用积分兑换商品而非抽奖。\n\n是否兑换巨无霸券（消耗 2000 积分）？" },
    { role: "user", text: "好的，兑换吧" },
    { role: "bot", text: "兑换成功！\n兑换券：巨无霸免费兑换券\n扣除积分：2000\n剩余积分：1500\n\n兑换券已加入你的优惠券钱包，可在任意麦当劳门店柜台或自助点餐机使用。" }
  ],
  report: [
    { role: "user", text: "帮我看看这个月消费报告" },
    { role: "bot", text: "<strong>=== 麦麦精算师 月度报告 ===</strong>\n\n<strong>本月订单：</strong>6 单，总计 ¥186\n<strong>优惠券节省：</strong><span class='money'>¥52</span>（使用 4 张券）\n<strong>积分变动：</strong>+820 获取，-2000 兑换\n<strong>当前余额：</strong>1,500 积分\n<strong>即将过期：</strong>500 积分（5 天后）\n\n<strong>行动建议：</strong>\n1. <span class='tag warn'>2 张优惠券本周过期</span> — 尽快使用！\n2. 积分余额偏低，近期消费可累积\n3. 当前抽奖期望值为负，不建议抽奖\n4. 有新优惠券可领 — 现在领取？\n\n本月总节省：<span class='money'>¥52</span> 现金 + <span class='points'>¥25 积分价值</span> = <strong>共节省 ¥77</strong>" }
  ]
};

const chatArea = document.getElementById("chatArea");
const tabs = document.querySelectorAll(".tab");

function renderScene(sceneKey) {
  const messages = scenes[sceneKey];
  chatArea.innerHTML = "";
  messages.forEach((msg, i) => {
    setTimeout(() => {
      const msgDiv = document.createElement("div");
      msgDiv.className = `msg ${msg.role}`;
      const avatar = document.createElement("div");
      avatar.className = `avatar ${msg.role}`;
      avatar.textContent = msg.role === "bot" ? "M" : "我";
      const bubble = document.createElement("div");
      bubble.className = "bubble";
      bubble.innerHTML = msg.text.replace(/\n/g, "<br>");
      msgDiv.appendChild(avatar);
      msgDiv.appendChild(bubble);
      chatArea.appendChild(msgDiv);
      chatArea.scrollTop = chatArea.scrollHeight;
    }, i * 600);
  });
}

tabs.forEach(tab => {
  tab.addEventListener("click", () => {
    tabs.forEach(t => t.classList.remove("active"));
    tab.classList.add("active");
    renderScene(tab.dataset.scene);
  });
});

renderScene("save");
</script>

</body>
</html>
